name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typecheck, bundle size and unit tests with coverage. The unit
  # coverage goes to the ci job, which merges it with the e2e shards'.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle size (initial JS < 150 kB gzip)
        run: npm run build -w @open-ancestry/web && npm run size

      - name: Unit tests with coverage
        run: npm test

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          # Re-running a failed job uploads again under the same name.
          overwrite: true
          path: coverage/unit/
          retention-days: 3

  # E2E in shards on their own runners (#261): one runner with 2 workers took
  # 23 minutes for both browsers, close to the job timeout. Each shard runs a
  # quarter of the Chromium and WebKit tests against an instrumented build and
  # uploads its raw coverage for the ci job to merge.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build (instrumented for coverage)
        run: npm run build
        env:
          E2E_COVERAGE: '1'

      - name: E2E tests, shard ${{ matrix.shard }} of 4
        run: npx playwright test -c e2e --shard=${{ matrix.shard }}/4
        env:
          E2E_COVERAGE: '1'

      - name: Slowest spec files
        if: ${{ !cancelled() && hashFiles('test-results/e2e-results.json') != '' }}
        run: npx tsx scripts/e2e-timings.ts test-results/e2e-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.shard }}
          # Re-running a failed job uploads again under the same name.
          overwrite: true
          path: coverage/e2e/raw/
          retention-days: 3

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          # Re-running a failed job uploads again under the same name.
          overwrite: true
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The gate: passes only when checks and every e2e shard passed, then merges
  # unit and e2e coverage and enforces its thresholds, as before the split.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, e2e]
    if: ${{ !cancelled() }}
    steps:
      # A skipped or failed dependency must fail this job: a skipped required
      # check would otherwise count as passing.
      - name: Checks and every e2e shard passed
        run: |
          echo "checks: ${{ needs.checks.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/

      - name: Download e2e coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-e2e-*
          path: coverage/e2e/raw/
          merge-multiple: true

      - name: Merge coverage
        run: npm run coverage:merge

      - name: Coverage job summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.md') != '' }}
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/summary.md

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/merged/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          # Re-running a failed job uploads again under the same name.
          overwrite: true
          path: coverage/merged/
          retention-days: 14

  # Node benchmarks on their own runner, alongside the e2e shards.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The cold-start and import benches spawn apps/cli/dist/cli.js, and the
      # CLI build bundles the web app and the import worker.
      - name: Build
        run: npm run build

      - name: Benchmarks
        run: npm run bench
        env:
          # Budgets are for an M-series laptop; shared runners are about 2-3x slower.
          OA_BENCH_FACTOR: '2.5'

  # Tree view budgets (design.md section 7) in the browser, on an uninstrumented
  # build and its own runner so coverage and other jobs do not skew timings.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tree view perf (10k and 100k trees)
        run: npm run e2e:perf
        env:
          # Budgets are for an M-series laptop; shared runners are about 2-3x slower.
          OA_BENCH_FACTOR: '2.5'

      - name: Perf job summary
        if: ${{ !cancelled() && hashFiles('perf-results/tree-view.md') != '' }}
        run: |
          {
            echo '## Tree view performance'
            echo
            echo "Budgets scaled by OA_BENCH_FACTOR=2.5 for shared runners."
            echo
            echo '| People | Measure | Result | Budget | Status |'
            echo '| --- | --- | --- | --- | --- |'
            cat perf-results/tree-view.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
