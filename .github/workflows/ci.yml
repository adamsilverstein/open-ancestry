name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle size (initial JS < 150 kB gzip)
        run: npm run build -w @open-ancestry/web && npm run size

      - name: Unit tests with coverage
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests with coverage
        run: npm run e2e:coverage

      - name: Merge coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:merge

      - name: Coverage job summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.md') != '' }}
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/summary.md

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/merged/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/merged/
          retention-days: 14

  # Node benchmarks on their own runner, so they run alongside e2e instead of
  # after it and keep the ci job well inside its timeout.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The cold-start and import benches spawn apps/cli/dist/cli.js, and the
      # CLI build bundles the web app and the import worker.
      - name: Build
        run: npm run build

      - name: Benchmarks
        run: npm run bench
        env:
          # Budgets are for an M-series laptop; shared runners are about 2-3x slower.
          OA_BENCH_FACTOR: '2.5'

  # Tree view budgets (design.md section 7) in the browser, on an uninstrumented
  # build and its own runner so coverage and other jobs do not skew timings.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tree view perf (10k and 100k trees)
        run: npm run e2e:perf
        env:
          # Budgets are for an M-series laptop; shared runners are about 2-3x slower.
          OA_BENCH_FACTOR: '2.5'

      - name: Perf job summary
        if: ${{ !cancelled() && hashFiles('perf-results/tree-view.md') != '' }}
        run: |
          {
            echo '## Tree view performance'
            echo
            echo "Budgets scaled by OA_BENCH_FACTOR=2.5 for shared runners."
            echo
            echo '| People | Measure | Result | Budget | Status |'
            echo '| --- | --- | --- | --- | --- |'
            cat perf-results/tree-view.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
