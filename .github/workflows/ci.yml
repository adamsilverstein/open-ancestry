name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests with coverage
        run: npm run e2e:coverage

      - name: Merge coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:merge

      - name: Coverage job summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.md') != '' }}
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/summary.md

      - name: Benchmarks
        run: npm run bench

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/merged/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/merged/
          retention-days: 14
